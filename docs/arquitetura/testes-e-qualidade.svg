<text x="1836" y="561" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="32" font-weight="700" fill="#7051A3">AUDITORIA SILVER · qualidade_contratos.ipynb</text>
<text x="1836" y="614" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#52657B">Dimensão</text>
<text x="2170" y="614" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#52657B">Regra avaliada em cada dataset</text>
<text x="3290" y="614" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="26" font-weight="700" fill="#52657B">Qtd.</text>
<rect x="1834" y="640" width="1678" height="180" rx="12" fill="#F0ECF8" stroke="none" stroke-width="2"/>
<text x="1854" y="696" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="700" fill="#7051A3">Completude</text>
<text x="2170" y="694" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="400" fill="#162B46">Nulos em vendor_id, total_amount, pickup e dropoff: Yellow ≤ 1%; Green ≤ 5%.</text>
<text x="2170" y="733" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="400" fill="#162B46">passenger_count: Yellow ≤ 5%; Green ≤ 10%.</text>
<text x="3310" y="700" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="32" font-weight="700" fill="#7051A3">5</text>
<rect x="1834" y="828" width="1678" height="185" rx="12" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<text x="1854" y="884" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="700" fill="#7051A3">Validade</text>
<text x="2170" y="882" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="400" fill="#162B46">total_amount ≥ 0 e trip_distance ≥ 0;</text>
<text x="2170" y="921" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="400" fill="#162B46">passenger_count NULL ou entre 0 e 8;</text>
<text x="2170" y="960" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="400" fill="#162B46">pickup de 2023-01-01 até antes de 2023-06-01.</text>
<text x="3310" y="888" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="32" font-weight="700" fill="#7051A3">4</text>
<rect x="1834" y="1021" width="1678" height="120" rx="12" fill="#F0ECF8" stroke="none" stroke-width="2"/>
<text x="1854" y="1077" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="700" fill="#7051A3">Unicidade</text>
<text x="2170" y="1075" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="400" fill="#162B46">Nenhuma duplicata pela chave trip_id.</text>
<text x="3310" y="1081" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="32" font-weight="700" fill="#7051A3">1</text>
<rect x="1834" y="1149" width="1678" height="120" rx="12" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<text x="1854" y="1205" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="700" fill="#7051A3">Consistência</text>
<text x="2170" y="1203" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="400" fill="#162B46">dropoff_datetime ≥ pickup_datetime.</text>
<text x="3310" y="1209" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="32" font-weight="700" fill="#7051A3">1</text>
<rect x="1834" y="1277" width="1678" height="150" rx="12" fill="#F0ECF8" stroke="none" stroke-width="2"/>
<text x="1854" y="1333" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="700" fill="#7051A3">Pontualidade</text>
<text x="2170" y="1331" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="400" fill="#162B46">Nenhuma corrida fora da janela histórica:</text>
<text x="2170" y="1370" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="400" fill="#162B46">2023-01-01 ≤ pickup &lt; 2023-06-01.</text>
<text x="3310" y="1337" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="32" font-weight="700" fill="#7051A3">1</text>
<text x="1836" y="1491" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="700" fill="#7051A3">Total: 12 por dataset × 2 datasets = 24 verificações em dados.</text>
<rect x="64" y="1580" width="1706" height="340" rx="22" fill="#FFFFFF" stroke="#CED9E6" stroke-width="2"/>
<rect x="86" y="1602" width="48" height="45" rx="12" fill="#E7F5F3" stroke="none" stroke-width="2"/>
<text x="97" y="1632" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#087E83">04</text>
<text x="152" y="1641" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="34" font-weight="700" fill="#162B46">Validação DAB · job independente</text>
<polyline points="90,1674 1744,1674" fill="none" stroke="#087E83" stroke-width="3" stroke-linejoin="round"/>
<text x="90" y="1727" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="30" font-weight="400" fill="#087E83">databricks bundle validate --target dev</text>
<text x="90" y="1789" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="400" fill="#162B46">Executada se DATABRICKS_HOST não estiver vazio. HOST e TOKEN vêm dos secrets; o CLI precisa autenticar no workspace.</text>
<text x="90" y="1841" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="400" fill="#52657B">A validação não faz deploy e não roda o Job.</text>
<rect x="1810" y="1580" width="1726" height="340" rx="22" fill="#FFFFFF" stroke="#CED9E6" stroke-width="2"/>
<rect x="1832" y="1602" width="48" height="45" rx="12" fill="#EAF1F9" stroke="none" stroke-width="2"/>
<text x="1843" y="1632" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#466B91">05</text>
<text x="1898" y="1641" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="34" font-weight="700" fill="#162B46">Qualidade durante a transformação</text>
<polyline points="1836,1674 3510,1674" fill="none" stroke="#466B91" stroke-width="3" stroke-linejoin="round"/>
<text x="1836" y="1735" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="400" fill="#162B46">MV privada: expect_all registra métricas no event log. O código classifica e roteia as linhas pelas regras DROP.</text>
<text x="1836" y="1787" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="400" fill="#162B46">Conformes → Silver; inválidas + duplicatas excedentes → quarentena. passenger_count nulo gera WARN e permanece na Silver.</text>
<rect x="64" y="2010" width="1706" height="340" rx="22" fill="#FFFFFF" stroke="#CED9E6" stroke-width="2"/>
<rect x="86" y="2032" width="48" height="45" rx="12" fill="#F0ECF8" stroke="none" stroke-width="2"/>
<text x="97" y="2062" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#7051A3">06</text>
<text x="152" y="2071" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="34" font-weight="700" fill="#162B46">Relatério e interrupção por falha</text>
<polyline points="90,2104 1744,2104" fill="none" stroke="#7051A3" stroke-width="3" stroke-linejoin="round"/>
<text x="90" y="2167" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="30" font-weight="700" fill="#7051A3">Job: pipeline_update → qualidade_contratos</text>
<text x="90" y="2219" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="400" fill="#162B46">Append em case_ifood.governanca.dq_resultados: PASS/FAIL, métrica, horário e até 5 exemplos JSON por regra com falha.</text>
<text x="90" y="2271" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="400" fill="#162B46">Após gravar, qualquer FAIL lança exceção no notebook.</text>
<rect x="1810" y="2010" width="1726" height="340" rx="22" fill="#FFFFFF" stroke="#CED9E6" stroke-width="2"/>
<rect x="1832" y="2032" width="48" height="45" rx="12" fill="#EDF1F5" stroke="none" stroke-width="2"/>
<text x="1843" y="2062" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#6C7887">07</text>
<text x="1898" y="2071" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="34" font-weight="700" fill="#162B46">Como interpretar as verificações</text>
<polyline points="1836,2104 3510,2104" fill="none" stroke="#6C7887" stroke-width="3" stroke-linejoin="round"/>
<text x="1836" y="2165" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="400" fill="#162B46">CI testa lógica Python e estrutura dos contratos; não executa Spark, joins, agregações ou dados reais.</text>
<text x="1836" y="2217" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="400" fill="#162B46">Auditoria lê a Silver após a quarentena; PASS não mede descartes. Pontualidade usa a janela histórica. Não há check de volume</text>
<text x="1836" y="2256" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="400" fill="#162B46">mínimo.</text>
<polyline points="64,2400 3536,2400" fill="none" stroke="#CED9E6" stroke-width="2" stroke-linejoin="round"/>
<text x="64" y="2460" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="27" font-weight="700" fill="#52657B">ESCOPO: configuração e implementação versionadas; resultados de execuções remotas não foram consultados.</text>
<text x="64" y="2509" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="26" font-weight="400" fill="#52657B">Pré-requisito de runtime: ajustar a célula inicial (Markdown marcado como código) e o import fixo do notebook de qualidade.</text>
<text x="64" y="2555" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="26" font-weight="400" fill="#52657B">CI sem lint, análise de segurança ou cobertura configurados · não há deploy automático no workflow atual.</text></svg>
