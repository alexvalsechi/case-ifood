<text x="90" y="790" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="29" font-weight="400" fill="#162B46">4 · Gold: membros existentes, nomes únicos, funções permitidas e enriquecimentos com dimensões/colunas válidas.</text>
<text x="90" y="843" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="400" fill="#162B46">1 · Referências: chave, colunas e fonte coerentes.</text>
<text x="90" y="882" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="400" fill="#162B46">1 · Motor: listar_contratos() carrega todos os datasets.</text>
