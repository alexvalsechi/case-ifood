<text x="97" y="1322" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#087E83">03</text>
<text x="152" y="1331" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="34" font-weight="700" fill="#162B46">Estrutura DAB · 2 testes</text>
