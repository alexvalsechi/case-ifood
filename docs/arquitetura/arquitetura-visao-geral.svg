<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1236" viewBox="0 0 1440 1236" role="img" aria-labelledby="title desc"><title id="title">Arquitetura: da configuração à consulta</title><desc id="desc">DAB publica pipeline e Jobs; bootstrap cria o ambiente e baixa fontes TLC; pipeline lê landing, materializa Bronze e Silver, enriquece Gold e permite consulta SQL. Auditoria e observabilidade executam após a materialização.</desc><rect width="100%" height="100%" fill="#F5F7FB"/><text x="56" y="64" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#087A7D">LAKEHOUSE NYC TAXI  /  DATABRICKS</text><text x="56" y="129" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="43" font-weight="700" fill="#1A2D45">Da configuração à consulta</text><text x="56" y="171" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#53657A">Visão geral · contratos YAML orientam a ingestão, a qualidade e a Gold</text><rect x="56" y="212" width="1328" height="122" rx="18" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="2"/><rect x="78" y="236" width="55" height="55" rx="14" fill="#E5F4F2" stroke="none" stroke-width="2"/><text x="91" y="273" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#087A7D">01</text><text x="157" y="265" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#1A2D45">Databricks Asset Bundle</text><text x="157" y="304" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#53657A">Valida e publica a definição do pipeline e dos Jobs · targets dev e prod</text><polyline points="720,334 720,370" fill="none" stroke="#53657A" stroke-width="3" stroke-linejoin="round"/><polygon points="720,370 714.2468935367496,359.4690092573155 725.7531064632504,359.4690092573155" fill="#53657A"/><rect x="56" y="382" width="1328" height="178" rx="18" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="2"/><rect x="78" y="406" width="55" height="55" rx="14" fill="#E5F4F2" stroke="none" stroke-width="2"/><text x="91" y="443" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#087A7D">02</text><text x="157" y="435" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#1A2D45">Bootstrap do ambiente · execução sob demanda</text><text x="157" y="476" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#1A2D45">Cria catálogo, schemas, volumes e tabelas de governança no Unity Catalog.</text><text x="157" y="517" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#53657A">Parquet por categoria/mês-ano com manifesto e log HTTP; CSV Taxi Zones separado.</text><polyline points="720,560 720,597" fill="none" stroke="#53657A" stroke-width="3" stroke-linejoin="round"/><polygon points="720,597 714.2468935367496,586.4690092573155 725.7531064632504,586.4690092573155" fill="#53657A"/><text x="56" y="636" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#087A7D">03  PIPELINE SDP · BRONZE → SILVER → GOLD</text><text x="1076" y="636" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#087A7D">CONSUMO</text><rect x="56" y="664" width="308" height="236" rx="18" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="2"/><rect x="74" y="682" width="272" height="57" rx="12" fill="#FBF0E4" stroke="none" stroke-width="2"/><text x="90" y="724" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#935924">Bronze</text><text x="80" y="788" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#1A2D45">Lê a landing e</text><text x="80" y="823" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#1A2D45">normaliza o schema.</text><text x="80" y="858" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#1A2D45">Preserva a origem.</text><rect x="396" y="664" width="308" height="236" rx="18" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="2"/><rect x="414" y="682" width="272" height="57" rx="12" fill="#EAF2FB" stroke="none" stroke-width="2"/><text x="430" y="724" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#416C97">Silver</text><text x="420" y="788" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#1A2D45">Padroniza e deduplica.</text><text x="420" y="823" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#1A2D45">Aplica regras e separa</text><text x="420" y="858" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#1A2D45">inválidos na quarentena.</text><rect x="736" y="664" width="308" height="236" rx="18" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="2"/><rect x="754" y="682" width="272" height="57" rx="12" fill="#FAF4D9" stroke="none" stroke-width="2"/><text x="770" y="724" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#85660F">Gold</text><text x="760" y="788" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#1A2D45">Unifica Yellow + Green.</text><text x="760" y="823" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#1A2D45">Adiciona dimensões e</text><text x="760" y="858" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#1A2D45">agregado diário.</text><rect x="1076" y="664" width="308" height="236" rx="18" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="2"/><rect x="1094" y="682" width="272" height="57" rx="12" fill="#E5F4F2" stroke="none" stroke-width="2"/><text x="1110" y="724" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#087A7D">Consulta SQL</text><text x="1100" y="788" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#1A2D45">Disponibiliza os dados</text><text x="1100" y="823" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#1A2D45">para análises no</text><text x="1100" y="858" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#1A2D45">notebook de respostas.</text><polyline points="367,782 390,782" fill="none" stroke="#087A7D" stroke-width="3" stroke-linejoin="round"/><polygon points="390,782 379.4690092573155,787.7531064632504 379.4690092573155,776.2468935367496" fill="#087A7D"/><polyline points="707,782 730,782" fill="none" stroke="#087A7D" stroke-width="3" stroke-linejoin="round"/><polygon points="730,782 719.4690092573155,787.7531064632504 719.4690092573155,776.2468935367496" fill="#087A7D"/><polyline points="1047,782 1070,782" fill="none" stroke="#087A7D" stroke-width="3" stroke-linejoin="round"/><polygon points="1070,782 1059.4690092573155,787.7531064632504 1059.4690092573155,776.2468935367496" fill="#087A7D"/><text x="56" y="946" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#53657A">Dimensões: fornecedores, tarifas, pagamentos, tipo de viagem e zonas de embarque/desembarque.</text><rect x="56" y="988" width="1328" height="138" rx="18" fill="#F1ECF8" stroke="none" stroke-width="2"/><text x="78" y="1038" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#71509C">Depois da materialização: auditoria de qualidade → observabilidade</text><text x="78" y="1077" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#1A2D45">O Job operacional atualiza o pipeline, audita a Silver e registra métricas de execução.</text><text x="78" y="1113" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#53657A">FAIL na auditoria interrompe o Job; a Gold já foi materializada nessa atualização.</text><text x="56" y="1187" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#53657A">Pré-requisitos e sequência de execução estão documentados no README.</text></svg>
