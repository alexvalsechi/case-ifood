# =============================================================================
# Declarative Automation Bundle (DAB) — case_nyc_taxi (medallion orientado a contratos)
# Fonte única do projeto: este repo (branch main). Regras do projeto: ver SDD.md.
#
# Deploy:
#   databricks bundle deploy -t dev    # desenvolvimento (development: true)
#   databricks bundle deploy -t prod   # produção (development: false)
# =============================================================================
bundle:
  name: case-nyc-taxi

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    resources:
      pipelines:
        case_nyc_taxi_medallion:
          development: true
  prod:
    mode: production
    resources:
      pipelines:
        case_nyc_taxi_medallion:
          development: false
