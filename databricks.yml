# =============================================================================
# Declarative Automation Bundle (DAB) — case_nyc_taxi (medallion orientado a contratos)
# Fonte única do projeto: este repo (branch main). Regras do projeto: ver SDD.md.
#
# Deploy:
#   databricks bundle deploy -t dev    # target com mode: development
#   databricks bundle deploy -t prod   # target com mode: production
# =============================================================================
bundle:
  name: case-nyc-taxi

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
