# =============================================================================
# Contrato de gold — corridas TLC (unificação das silvers de green e yellow)
# Declara explicitamente quais datasets formam a visão de consumo e quais
# agregados derivam dela. O pipeline gera as MVs gold a partir deste arquivo.
# =============================================================================
nome: case_nyc_taxi.gold.trips_consolidado
descricao: >
  União dos datasets silver com taxi_type — camada de consumo.

# Datasets (contratos de ingestão) unificados no consolidado, na ordem em que a
# união acontece: o primeiro membro define o layout de colunas base e os
# seguintes acrescentam colunas próprias (unionByName com colunas ausentes).
membros: [green_trips, yellow_trips]

cluster_by_auto: true

# LEFT JOINs enriquecem os fatos mantendo todas as corridas e as chaves de
# origem. Valores sem correspondência permanecem com descrição nula.
enriquecimentos:
  - dimensao: case_nyc_taxi.silver.dim_vendor
    chave_fato: vendor_id
    chave_dimensao: vendor_id
    colunas:
      - {origem: vendor_name, alias: vendor_name}
  - dimensao: case_nyc_taxi.silver.dim_rate_code
    chave_fato: rate_code_id
    chave_dimensao: rate_code_id
    colunas:
      - {origem: rate_code_name, alias: rate_code_name}
  - dimensao: case_nyc_taxi.silver.dim_payment_type
    chave_fato: payment_type
    chave_dimensao: payment_type
    colunas:
      - {origem: payment_type_name, alias: payment_type_name}
  - dimensao: case_nyc_taxi.silver.dim_trip_type
    chave_fato: trip_type
    chave_dimensao: trip_type
    colunas:
      - {origem: trip_type_name, alias: trip_type_name}
  - dimensao: case_nyc_taxi.silver.dim_taxi_zone
    chave_fato: pickup_location_id
    chave_dimensao: LocationID
    colunas:
      - {origem: Borough, alias: pickup_borough}
      - {origem: Zone, alias: pickup_zone}
      - {origem: service_zone, alias: pickup_service_zone}
  - dimensao: case_nyc_taxi.silver.dim_taxi_zone
    chave_fato: dropoff_location_id
    chave_dimensao: LocationID
    colunas:
      - {origem: Borough, alias: dropoff_borough}
      - {origem: Zone, alias: dropoff_zone}
      - {origem: service_zone, alias: dropoff_service_zone}

# Agregados derivados do consolidado (uma MV gold por item).
agregados:
  - nome: case_nyc_taxi.gold.trips_diario
    descricao: >
      Agregado diário por taxi_type: corridas, média de total_amount e de
      passageiros.
    # dimensões de agrupamento: coluna (+ alias e transformação opcionais;
    # transformação suportada: to_date)
    agrupar_por:
      - alias: data_corrida
        coluna: pickup_datetime
        transformacao: to_date
      - coluna: taxi_type
    # medidas: funcao em [count, count_distinct, sum, avg, min, max]
    medidas:
      - alias: qtd_corridas
        funcao: count
        coluna: "*"
      - alias: media_total_amount
        funcao: avg
        coluna: total_amount
      - alias: media_passageiros
        funcao: avg
        coluna: passenger_count
      - alias: soma_distancia_km
        funcao: sum
        coluna: trip_distance
    cluster_by: [data_corrida]
