# Pipeline SDP medallion bronze→silver→gold gerado a partir dos contratos YAML
# (contracts/ de ingestão, references e gold). Nenhuma lógica de dataset aqui —
# a fonte de verdade é o contrato. Ver SDD.md.
resources:
  pipelines:
    case_ifood_medallion:
      name: case_ifood_medallion
      catalog: case_ifood
      schema: bronze
      serverless: true
      photon: true
      channel: CURRENT
      continuous: false
      development: true   # target dev; prod sobrescreve para false em databricks.yml
      configuration:
        # Path dos contratos, portável por target: no deploy via DAB resolve
        # para o file_path do bundle; o motor lê via spark.conf.
        case_ifood.contracts_dir: ${workspace.file_path}/contracts
      tags:
        case: ifood
        dominio: mobilidade_urbana
        padrao: medallion
      libraries:
        - file:
            path: 02_pipelines/pipeline_case_ifood.py
