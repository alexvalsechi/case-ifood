# Pipeline SDP medallion bronze→silver→gold gerado a partir dos contratos YAML
# (src/contracts/ de ingestão, references e gold). Nenhuma lógica de dataset aqui —
# a fonte de verdade é o contrato. Ver SDD.md.
resources:
  pipelines:
    case_nyc_taxi_medallion:
      name: case_nyc_taxi_medallion
      catalog: case_nyc_taxi
      schema: bronze
      serverless: true
      photon: true
      channel: CURRENT
      continuous: false
      configuration:
        # Path dos contratos, portável por target: no deploy via DAB resolve
        # para o file_path do bundle; o motor lê via spark.conf.
        case_nyc_taxi.contracts_dir: ${workspace.file_path}/src/contracts
      tags:
        case: nyc_taxi
        dominio: mobilidade_urbana
        padrao: medallion
      environment:
        dependencies:
          - PyYAML>=6.0
      libraries:
        - file:
            path: ../src/02_pipelines/pipeline_case_nyc_taxi.py
